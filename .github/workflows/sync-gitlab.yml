name: Sync main to GitLab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push main to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        shell: bash
        run: |
          set +x
          if [[ -z "$GITLAB_TOKEN" ]]; then
            echo "Set the GITLAB_TOKEN repository secret."
            exit 1
          fi
          gitlab_url="https://gitlab.com/manav252/paperdesk.git"
          auth_header="Authorization: Basic $(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 | tr -d '\n')"
          git -c "http.extraheader=$auth_header" push "$gitlab_url" main:main
